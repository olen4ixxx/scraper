name: Ryanair data collection

on:
  schedule:
    # 03:00 UTC daily - clear of the app's own in-process 2 AM UTC scheduler
    # (SchedulerConfig), which only fires if the app happens to still be
    # running at that time; this job starts, collects, and stops well before.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Boots the full Spring Boot app (Flyway runs the schema automatically
      # against whatever database SPRING_DATASOURCE_URL points at, even a
      # brand-new empty one) and calls the existing /collect/ryanair endpoint,
      # which blocks until the whole collection run finishes. Scoped to Ryanair
      # only - WizzAir needs a real headed browser to get past Kasada bot
      # detection, which a GitHub runner can't provide, so Wizz stays a manual
      # run on a real machine.
      - name: Start app and run Ryanair collection
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.DB_JDBC_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ./gradlew :app:bootRun --no-daemon > app-run.log 2>&1 &
          APP_PID=$!

          echo "Waiting for app to start..."
          up=false
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/ -o /dev/null; then
              echo "App is up after ${i} checks"
              up=true
              break
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "App process died during startup"
              cat app-run.log
              exit 1
            fi
            sleep 5
          done

          if [ "$up" != true ]; then
            echo "App did not start in time"
            cat app-run.log
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi

          echo "Triggering Ryanair collection (blocks until finished)..."
          curl -sf -X POST http://localhost:8080/collect/ryanair --max-time 10800
          COLLECT_STATUS=$?

          kill $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true

          exit $COLLECT_STATUS

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-run-log
          path: app-run.log

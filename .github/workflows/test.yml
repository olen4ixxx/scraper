name: Tests

# On every push and every pull request, because the point of these tests is to catch the kind of
# breakage that is otherwise invisible. Both long silences this project has had - WizzAir behind a
# moved API version for nine days, Transavia behind a changed response shape - were failures that
# looked exactly like ordinary empty answers, and neither was noticed by anyone looking at a
# screen. A suite that only runs when someone remembers to run it would not have caught them
# either.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run the tests
        run: ./gradlew test --console=plain

      # The browser is the only thing that ever parses this, and it does so in front of a
      # visitor. A stray brace in the date-range widget once took the whole search form down
      # with a syntax error, and nothing caught it but opening the page. Node is already on the
      # runner, so parsing it here costs a second.
      - name: Check the page scripts parse
        run: |
          for script in app/src/main/resources/static/js/*.js; do
            echo "checking $script"
            node --check "$script"
          done

      # A failed run has to say what failed, somewhere anyone can read it. The console output
      # scrolls past, the artifact below needs a login to download, and the annotation - the one
      # part of a run that is public on a public repository - said only "Process completed with
      # exit code 1", which is the least informative true statement available. The reports are
      # already sitting on the runner as XML; this turns them back into the sentence the
      # assertion was written with.
      - name: Say which tests failed
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob('**/build/test-results/test/*.xml', recursive=True)):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      # Commas separate the properties of an annotation, so a display name
                      # containing one would have its title cut off at the comma.
                      where = (case.get('classname', '') + ' > ' + case.get('name', '')).replace(',', ';')
                      detail = (bad.get('message') or bad.text or '').strip().splitlines()
                      # The annotation takes one line, so it gets the assertion's own message;
                      # the rest goes to the log for whoever can read it.
                      print('::error title=%s::%s' % (where, detail[0] if detail else 'failed'))
                      print('\n'.join(detail[:25]))
          PY

      # The reports say which case failed and why, which the console output alone does not once
      # a run has scrolled past.
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7

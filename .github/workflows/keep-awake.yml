name: Keep the site awake

# A free Render instance sleeps after 15 minutes without traffic, and waking it
# takes the best part of a minute - long enough that a first-time visitor assumes
# the site is broken. Pinging inside waking hours avoids that.
#
# Worth knowing: GitHub does not promise punctual scheduled runs. Measured across
# this repository's own scheduled runs, they arrived 26 minutes late on average and
# 57 at worst, and the documentation warns they can be dropped altogether under
# enough load. A ping arriving that late finds the instance already asleep, so this
# reduces cold starts rather than removing them - a dedicated uptime pinger keeps
# time properly and would cost nothing here either.
on:
  schedule:
    # 06:00-21:59 UTC = 08:00-23:59 in Poland during summer time. Cron is always UTC
    # and doesn't follow DST, so in winter this shifts an hour earlier locally
    # (07:00-22:59) until the hours here are adjusted.
    #
    # Twelve minutes apart, and never on the hour: "*/14" would fire at :00, which is
    # when every other repository's schedules are queued too and the delays measured
    # here were worst. Twelve also leaves the wrap-around gap (:51 to the next :03)
    # inside the fifteen minutes it takes the instance to fall asleep, which "*/14"
    # did not - it left eighteen.
    - cron: '3,15,27,39,51 6-21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the site
        run: |
          # --max-time covers a cold start, which is the case this exists for:
          # if the instance had already fallen asleep, this request is what wakes it.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 https://azair.onrender.com/)
          echo "Site answered $code"
          # Anything other than a 2xx means the site is down rather than merely
          # asleep, which is worth a failed run to notice.
          case "$code" in
            2*) exit 0 ;;
            *) echo "Unexpected response"; exit 1 ;;
          esac

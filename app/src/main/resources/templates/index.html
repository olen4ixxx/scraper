<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-row label {
            margin-bottom: 8px;
        }

        .clear-all-btn {
            background: none;
            border: none;
            color: #667eea;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            margin-bottom: 8px;
        }

        .clear-all-btn:hover {
            text-decoration: underline;
        }
        
        select, input[type="date"], input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .row {
            display: flex;
            gap: 15px;
        }
        
        .row .form-group {
            flex: 1;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }
        
        .airline-checkboxes {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .conn-window {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .conn-field {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .conn-field-label {
            font-size: 13px;
            color: #777;
            margin-right: 4px;
        }

        input.conn-input {
            width: 60px;
            padding: 8px 6px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
        }

        input.conn-input:focus {
            outline: none;
            border-color: #667eea;
        }

        input.conn-input:disabled {
            background: #f2f2f2;
            color: #aaa;
        }

        .conn-unit {
            font-size: 13px;
            color: #777;
        }

        .conn-hint {
            font-size: 12px;
            color: #999;
        }

        .daterange {
            position: relative;
        }

        input.daterange-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        input.daterange-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .calendar {
            display: none;
            position: absolute;
            z-index: 40;
            top: calc(100% + 4px);
            left: 0;
            width: 280px;
            max-width: 92vw;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            padding: 10px;
        }

        .calendar.open {
            display: block;
        }

        .calendar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .calendar-month {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .calendar-nav {
            background: none;
            border: none;
            font-size: 18px;
            line-height: 1;
            color: #667eea;
            cursor: pointer;
            padding: 2px 8px;
        }

        .calendar-nav:disabled {
            color: #ccc;
            cursor: default;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .calendar-dow {
            text-align: center;
            font-size: 11px;
            color: #999;
            padding: 2px 0;
        }

        .calendar-day {
            border: none;
            background: none;
            padding: 7px 0;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            color: #333;
        }

        .calendar-day:hover:not(:disabled) {
            background: #eef0fd;
        }

        .calendar-day:disabled {
            color: #ccc;
            cursor: default;
        }

        .calendar-day.in-range {
            background: #eef0fd;
            border-radius: 0;
        }

        .calendar-day.selected {
            background: #667eea;
            color: white;
        }

        .calendar-day.blank {
            visibility: hidden;
        }

        .calendar-hint {
            font-size: 11px;
            color: #999;
            margin-top: 8px;
            text-align: center;
        }

        /* Phones: the form is a single column, and controls get big enough to tap. */
        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 20px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            .conn-window {
                gap: 12px;
            }

            .airline-checkboxes {
                flex-wrap: wrap;
                gap: 12px 20px;
            }

            .calendar {
                width: 100%;
            }

            .calendar-day {
                padding: 10px 0;
            }

            select, input[type="date"], input[type="text"], input.daterange-input {
                font-size: 16px; /* keeps iOS from zooming in on focus */
            }
        }
        
        .search-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        
        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .search-button:active {
            transform: translateY(0);
        }

        .combo-wrapper {
            position: relative;
        }

        .suggestions {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            max-height: 320px;
            overflow-y: auto;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .suggestions.open {
            display: block;
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 15px;
            color: #333;
        }

        .suggestion-item:hover, .suggestion-item.active {
            background: #f0f0fb;
        }

        .suggestion-anywhere {
            font-weight: 600;
        }

        .suggestion-country {
            font-weight: 700;
            color: #667eea;
            background: #f7f7fc;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .suggestion-city {
            padding-left: 28px;
            font-weight: 600;
            color: #555;
        }

        .suggestion-airport {
            padding-left: 44px;
        }

        .suggestion-empty {
            padding: 15px;
            color: #999;
            font-size: 14px;
            text-align: center;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #eef0fd;
            color: #444;
            border-radius: 20px;
            padding: 6px 8px 6px 14px;
            font-size: 14px;
        }

        .chip-label {
            white-space: nowrap;
        }

        .chip-nearby-btn, .chip-remove {
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chip-nearby-btn:hover, .chip-remove:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        .nearby-panel {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .nearby-panel-title {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #667eea;
            background: #f7f7fc;
        }

        .nearby-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
        }

        .nearby-item:hover {
            background: #f0f0fb;
        }

        .nearby-item .distance {
            color: #999;
            font-size: 12px;
        }

        .nearby-empty {
            padding: 10px 12px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈ Flight Search</h1>
        
        <form action="/results" method="get">
            <div class="form-group">
                <div class="label-row">
                    <label for="from">From</label>
                    <button type="button" id="swapFromTo" class="clear-all-btn" title="Swap From and To">⇄ Swap</button>
                </div>
                <select id="from" name="from" required>
                    <option value="POLAND">Poland (all airports)</option>
                    <optgroup label="Poland">
                        <option value="WARSAW">Warsaw (WAW + WMI)</option>
                        <option value="WAW">Warsaw Chopin (WAW)</option>
                        <option value="WMI">Warsaw Modlin (WMI)</option>
                        <option value="KRK">Krakow (KRK)</option>
                        <option value="GDN">Gdansk (GDN)</option>
                        <option value="WRO">Wroclaw (WRO)</option>
                        <option value="POZ">Poznan (POZ)</option>
                        <option value="KTW">Katowice (KTW)</option>
                        <option value="RZE">Rzeszow (RZE)</option>
                        <option value="LUZ">Lublin (LUZ)</option>
                        <option value="SZZ">Szczecin (SZZ)</option>
                        <option value="BZG">Bydgoszcz (BZG)</option>
                    </optgroup>
                </select>
            </div>
            
            <div class="form-group combo-wrapper">
                <div class="label-row">
                    <label for="toSearch">To</label>
                    <button type="button" id="toClearAll" class="clear-all-btn" style="display:none;">Clear all</button>
                </div>
                <div class="chips" id="toChips"></div>
                <div class="nearby-panel" id="nearbyPanel" style="display:none;"></div>
                <input type="text" id="toSearch" autocomplete="off" placeholder="Add city, airport code or country...">
                <input type="hidden" id="to" name="to" required>
                <div id="toSuggestions" class="suggestions"></div>
            </div>
            
            <!-- One field per direction rather than a start box and an end box: picking a
                 range is two clicks on the same calendar, and a single date is just a range
                 that starts and ends on the same day. -->
            <div class="row">
                <div class="form-group">
                    <label for="departureRangeInput">Departure</label>
                    <div class="daterange" id="departureRange">
                        <input type="text" id="departureRangeInput" class="daterange-input" readonly
                               placeholder="Pick a day or a range" autocomplete="off">
                        <input type="hidden" id="departure" name="departure" required>
                        <input type="hidden" id="departureRangeEnd" name="departureRangeEnd">
                        <div class="calendar"></div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="label-row">
                        <label for="returnRangeInput">Return (optional)</label>
                        <button type="button" id="returnClear" class="clear-all-btn" style="display:none;">Clear</button>
                    </div>
                    <div class="daterange" id="returnRange">
                        <input type="text" id="returnRangeInput" class="daterange-input" readonly
                               placeholder="One way" autocomplete="off">
                        <input type="hidden" id="returnDate" name="returnDate">
                        <input type="hidden" id="returnRangeEnd" name="returnRangeEnd">
                        <div class="calendar"></div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="maxStops">Maximum stops</label>
                <select id="maxStops" name="maxStops">
                    <option value="0">Direct only</option>
                    <option value="1" selected>1 stop</option>
                    <option value="2">2 stops</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Connection time (for 1+ stop searches)</label>
                <div class="conn-window">
                    <div class="conn-field">
                        <span class="conn-field-label">From</span>
                        <input type="number" id="minConnHours" class="conn-input" min="0" max="47" step="1" value="0">
                        <span class="conn-unit">h</span>
                        <input type="number" id="minConnMinutes" class="conn-input" min="0" max="45" step="15" value="30">
                        <span class="conn-unit">m</span>
                    </div>
                    <div class="conn-field">
                        <span class="conn-field-label">to</span>
                        <input type="number" id="maxConnHours" class="conn-input" min="0" max="47" step="1" value="24">
                        <span class="conn-unit">h</span>
                        <input type="number" id="maxConnMinutes" class="conn-input" min="0" max="45" step="15" value="0">
                        <span class="conn-unit">m</span>
                    </div>
                    <div class="conn-field">
                        <span class="conn-field-label">Max days to wait</span>
                        <input type="number" id="maxConnDays" class="conn-input" min="0" max="30" step="1" value="0">
                        <span class="conn-hint">0 = off, overrides "to" above when ≥ 1</span>
                    </div>
                </div>
                <input type="hidden" id="minConnectionMinutesHidden" name="minConnectionMinutes">
                <input type="hidden" id="maxConnectionMinutesHidden" name="maxConnectionMinutes">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="allowOvernightConnection" name="allowOvernightConnection">
                <label for="allowOvernightConnection">I don't mind waiting at the airport overnight</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="schengenConnectionsOnly" name="schengenConnectionsOnly" checked>
                <label for="schengenConnectionsOnly">Change planes inside Schengen only</label>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="allowGroundTransfer" name="allowGroundTransfer" checked>
                    <label for="allowGroundTransfer">Allow ground transfer between nearby airports</label>
                </div>
                <div class="conn-window" id="groundTransferRadiusRow">
                    <div class="conn-field">
                        <span class="conn-field-label">Within</span>
                        <input type="number" id="groundTransferRadiusKm" name="groundTransferRadiusKm" class="conn-input" min="0" max="500" step="50" value="100">
                        <span class="conn-unit">km</span>
                    </div>
                </div>
            </div>

            <div class="form-group" id="stayDurationGroup">
                <label>Length of stay</label>
                <div class="conn-window">
                    <div class="conn-field">
                        <span class="conn-field-label">Min</span>
                        <input type="number" id="stayMinDays" name="stayMinDays" class="conn-input" min="0" max="365" step="1" placeholder="any">
                        <span class="conn-unit">days</span>
                    </div>
                    <div class="conn-field">
                        <span class="conn-field-label">Max</span>
                        <input type="number" id="stayMaxDays" name="stayMaxDays" class="conn-input" min="0" max="365" step="1" placeholder="any">
                        <span class="conn-unit">days</span>
                    </div>
                </div>
            </div>

            <!-- Phrased as what stays the same rather than what may differ: "return to the
                 same airport I left from" is the thing being kept, and ticked is the stricter
                 search. The two hidden fields carry the opposite to the server, which asks
                 whether a difference is allowed. -->
            <div class="form-group" id="asymmetricAirportsGroup">
                <label>Round-trip airports</label>
                <div class="conn-window">
                    <div class="conn-field">
                        <span class="conn-field-label">Return</span>
                        <input type="checkbox" id="sameDepartAirport" checked>
                        <label for="sameDepartAirport">to same depart airport</label>
                    </div>
                    <div class="conn-field">
                        <input type="checkbox" id="sameArrivalAirport" checked>
                        <label for="sameArrivalAirport">from same arrival airport</label>
                    </div>
                </div>
                <input type="hidden" id="allowReturnToDifferentAirport" name="allowReturnToDifferentAirport">
                <input type="hidden" id="allowReturnFromDifferentAirport" name="allowReturnFromDifferentAirport">
            </div>

            <div class="form-group">
                <label>Airlines</label>
                <!-- Built from the airlines actually present in the database, so an airline
                     starts being filterable as soon as its first flights are collected -
                     by this application or by anything else writing to the same schema. -->
                <div class="airline-checkboxes">
                    <div class="checkbox-group" th:each="airline : ${availableAirlines}">
                        <input type="checkbox" name="airlines" class="airline-checkbox"
                               th:id="${'airline-' + airline}" th:value="${airline}" checked>
                        <label th:for="${'airline-' + airline}" th:text="${airline}">Ryanair</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="sortBy">Sort by</label>
                <select id="sortBy" name="sortBy">
                    <option value="CHEAPEST" selected>Cheapest</option>
                    <option value="SHORTEST">Shortest</option>
                    <option value="EARLIEST_DEPARTURE">Earliest departure</option>
                    <option value="LATEST_DEPARTURE">Latest departure</option>
                    <option value="FEWEST_STOPS">Fewest stops</option>
                </select>
            </div>
            
            <button type="submit" class="search-button">SEARCH FLIGHTS</button>
        </form>
    </div>
    
    <script th:inline="javascript">
        const DESTINATIONS = /*[[${destinations}]]*/ [];
        const PREFILL = {
            from: /*[[${prefillFrom}]]*/ null,
            to: /*[[${prefillTo}]]*/ null,
            departure: /*[[${prefillDeparture}]]*/ null,
            departureRangeEnd: /*[[${prefillDepartureRangeEnd}]]*/ null,
            returnDate: /*[[${prefillReturnDate}]]*/ null,
            returnRangeEnd: /*[[${prefillReturnRangeEnd}]]*/ null,
            directOnly: /*[[${prefillDirectOnly}]]*/ false,
            maxStops: /*[[${prefillMaxStops}]]*/ null,
            airlines: /*[[${prefillAirlines}]]*/ null,
            sortBy: /*[[${prefillSortBy}]]*/ null,
            minConnectionMinutes: /*[[${prefillMinConnectionMinutes}]]*/ null,
            maxConnectionMinutes: /*[[${prefillMaxConnectionMinutes}]]*/ null,
            stayMinDays: /*[[${prefillStayMinDays}]]*/ null,
            stayMaxDays: /*[[${prefillStayMaxDays}]]*/ null,
            allowOvernightConnection: /*[[${prefillAllowOvernightConnection}]]*/ false,
            allowReturnToDifferentAirport: /*[[${prefillAllowReturnToDifferentAirport}]]*/ false,
            allowReturnFromDifferentAirport: /*[[${prefillAllowReturnFromDifferentAirport}]]*/ false,
            allowGroundTransfer: /*[[${prefillAllowGroundTransfer}]]*/ false,
            groundTransferRadiusKm: /*[[${prefillGroundTransferRadiusKm}]]*/ null,
            schengenConnectionsOnly: /*[[${prefillSchengenConnectionsOnly}]]*/ false
        };
        // False on a first visit, true when arriving back through "Back to search". Without
        // it, an unticked box in a previous search is indistinguishable from no previous
        // search at all, and every default below would be overwritten with "off".
        const HAS_PREVIOUS_SEARCH = /*[[${hasPreviousSearch}]]*/ false;
    </script>
    <script>
    (function() {
        const searchInput = document.getElementById('toSearch');
        const hiddenInput = document.getElementById('to');
        const suggestionsBox = document.getElementById('toSuggestions');
        const chipsBox = document.getElementById('toChips');
        const nearbyPanel = document.getElementById('nearbyPanel');
        const clearAllBtn = document.getElementById('toClearAll');

        const byCountry = {};
        DESTINATIONS.forEach(function(a) {
            if (!byCountry[a.country]) byCountry[a.country] = [];
            byCountry[a.country].push(a);
        });
        const countries = Object.keys(byCountry).sort();

        let selected = [];
        let nearbyOpenFor = null;

        function haversineKm(lat1, lon1, lat2, lon2) {
            const r = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
                + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180)
                * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return r * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function hideNearbyPanel() {
            nearbyOpenFor = null;
            nearbyPanel.style.display = 'none';
            nearbyPanel.innerHTML = '';
        }

        function showNearby(iata) {
            const target = DESTINATIONS.find(function(a) { return a.iata === iata; });
            if (!target) return;

            const selectedValues = selected.map(function(s) { return s.value; });
            const nearby = DESTINATIONS
                .filter(function(a) { return a.iata !== iata && selectedValues.indexOf(a.iata) === -1; })
                .map(function(a) { return { airport: a, distance: haversineKm(target.lat, target.lon, a.lat, a.lon) }; })
                .sort(function(x, y) { return x.distance - y.distance; })
                .slice(0, 10);

            nearbyPanel.innerHTML = '';
            const title = document.createElement('div');
            title.className = 'nearby-panel-title';
            title.textContent = 'Airports near ' + target.city + ', in order of distance';
            nearbyPanel.appendChild(title);

            if (nearby.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'nearby-empty';
                empty.textContent = 'No other collected airports nearby';
                nearbyPanel.appendChild(empty);
            } else {
                nearby.forEach(function(n) {
                    const item = document.createElement('div');
                    item.className = 'nearby-item';

                    const label = document.createElement('span');
                    label.textContent = n.airport.city + ' (' + n.airport.iata + ')';

                    const dist = document.createElement('span');
                    dist.className = 'distance';
                    dist.textContent = Math.round(n.distance) + ' km';

                    item.appendChild(label);
                    item.appendChild(dist);
                    item.addEventListener('click', function() {
                        addSelection(n.airport.city + ' (' + n.airport.iata + ')', n.airport.iata, 'airport');
                        showNearby(iata);
                    });
                    nearbyPanel.appendChild(item);
                });
            }

            nearbyPanel.style.display = 'block';
            nearbyOpenFor = iata;
        }

        function toggleNearby(iata) {
            if (nearbyOpenFor === iata) {
                hideNearbyPanel();
            } else {
                showNearby(iata);
            }
        }

        function renderChips() {
            chipsBox.innerHTML = '';
            selected.forEach(function(s) {
                const chip = document.createElement('div');
                chip.className = 'chip';

                const label = document.createElement('span');
                label.className = 'chip-label';
                label.textContent = s.label;
                chip.appendChild(label);

                if (s.kind === 'airport') {
                    const nearbyBtn = document.createElement('button');
                    nearbyBtn.type = 'button';
                    nearbyBtn.className = 'chip-nearby-btn';
                    nearbyBtn.textContent = '+';
                    nearbyBtn.title = 'Show nearby airports';
                    nearbyBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        toggleNearby(s.value);
                    });
                    chip.appendChild(nearbyBtn);
                } else if (s.kind === 'country' || s.kind === 'city') {
                    const addMoreBtn = document.createElement('button');
                    addMoreBtn.type = 'button';
                    addMoreBtn.className = 'chip-nearby-btn';
                    addMoreBtn.textContent = '+';
                    addMoreBtn.title = 'Add another airport or country';
                    addMoreBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        hideNearbyPanel();
                        searchInput.focus();
                        render(searchInput.value);
                    });
                    chip.appendChild(addMoreBtn);
                }

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'chip-remove';
                removeBtn.textContent = '×';
                removeBtn.title = 'Remove';
                removeBtn.addEventListener('click', function() {
                    removeSelection(s.value);
                });
                chip.appendChild(removeBtn);

                chipsBox.appendChild(chip);
            });

            hiddenInput.value = selected.map(function(s) { return s.value; }).join(',');
            clearAllBtn.style.display = selected.length > 0 ? 'inline' : 'none';
        }

        function addSelection(label, value, kind) {
            if (kind === 'anywhere') {
                selected = [{ label: label, value: value, kind: kind }];
            } else {
                selected = selected.filter(function(s) { return s.kind !== 'anywhere' && s.value !== value; });
                selected.push({ label: label, value: value, kind: kind });
            }
            searchInput.value = '';
            suggestionsBox.classList.remove('open');
            hideNearbyPanel();
            renderChips();
        }

        function removeSelection(value) {
            selected = selected.filter(function(s) { return s.value !== value; });
            hideNearbyPanel();
            renderChips();
        }

        function addSuggestionItem(label, value, kind, className) {
            const item = document.createElement('div');
            item.className = 'suggestion-item' + (className ? ' ' + className : '');
            item.textContent = label;
            item.addEventListener('mousedown', function(e) {
                e.preventDefault();
                addSelection(label, value, kind);
            });
            suggestionsBox.appendChild(item);
        }

        function render(filter) {
            const q = (filter || '').trim().toLowerCase();
            suggestionsBox.innerHTML = '';
            let anyMatch = false;

            if (!q || 'anywhere'.indexOf(q) !== -1) {
                addSuggestionItem('Anywhere', 'ANYWHERE', 'anywhere', 'suggestion-anywhere');
                anyMatch = true;
            }

            countries.forEach(function(country) {
                const airports = byCountry[country];
                const countryMatches = country.toLowerCase().indexOf(q) !== -1;
                const matchingAirports = airports.filter(function(a) {
                    return countryMatches
                        || a.city.toLowerCase().indexOf(q) !== -1
                        || a.iata.toLowerCase().indexOf(q) !== -1
                        || a.name.toLowerCase().indexOf(q) !== -1;
                });

                if (q && !countryMatches && matchingAirports.length === 0) {
                    return;
                }

                const byCity = {};
                airports.forEach(function(a) {
                    if (!byCity[a.city]) byCity[a.city] = [];
                    byCity[a.city].push(a);
                });
                const cityNames = Object.keys(byCity).sort();

                let countryHeaderAdded = false;
                cityNames.forEach(function(cityName) {
                    const cityAirports = byCity[cityName];
                    const cityMatches = countryMatches || cityName.toLowerCase().indexOf(q) !== -1;
                    const shownAirports = cityAirports.filter(function(a) {
                        return cityMatches
                            || a.iata.toLowerCase().indexOf(q) !== -1
                            || a.name.toLowerCase().indexOf(q) !== -1;
                    });
                    if (shownAirports.length === 0) return;

                    if (!countryHeaderAdded) {
                        anyMatch = true;
                        addSuggestionItem('🌍 All of ' + country + ' (' + airports.length + ')', 'COUNTRY:' + country, 'country', 'suggestion-country');
                        countryHeaderAdded = true;
                    }

                    if (cityAirports.length > 1) {
                        addSuggestionItem(cityName + ' (All ' + cityAirports.length + ')', 'CITY:' + cityName, 'city', 'suggestion-city');
                    }
                    shownAirports.forEach(function(a) {
                        addSuggestionItem(a.city + ' (' + a.iata + ')', a.iata, 'airport', 'suggestion-airport');
                    });
                });
            });

            if (!anyMatch) {
                const empty = document.createElement('div');
                empty.className = 'suggestion-empty';
                empty.textContent = 'No matches';
                suggestionsBox.appendChild(empty);
            }

            suggestionsBox.classList.add('open');
        }

        searchInput.addEventListener('focus', function() {
            render(searchInput.value);
        });
        searchInput.addEventListener('input', function() {
            render(searchInput.value);
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.combo-wrapper')) {
                suggestionsBox.classList.remove('open');
                hideNearbyPanel();
            }
        });

        document.querySelector('form').addEventListener('submit', function(e) {
            if (!hiddenInput.value) {
                e.preventDefault();
                searchInput.style.borderColor = '#e53935';
                searchInput.focus();
                render(searchInput.value);
            }
        });

        clearAllBtn.addEventListener('click', function() {
            selected = [];
            hideNearbyPanel();
            suggestionsBox.classList.remove('open');
            renderChips();
            searchInput.focus();
        });

        function tokenToSelection(token) {
            const upper = token.toUpperCase();
            if (upper === 'ANYWHERE') {
                return { label: 'Anywhere', value: 'ANYWHERE', kind: 'anywhere' };
            }
            if (upper.indexOf('COUNTRY:') === 0) {
                const name = token.substring(8);
                return { label: '🌍 All of ' + name, value: 'COUNTRY:' + name, kind: 'country' };
            }
            if (upper.indexOf('CITY:') === 0) {
                const name = token.substring(5);
                return { label: name + ' (All)', value: 'CITY:' + name, kind: 'city' };
            }
            // The two shorthands the "From" list offers - they mean the same on either side of
            // a search, so they survive a swap instead of turning into unreadable chips.
            if (upper === 'POLAND') {
                return { label: '🌍 Poland (all airports)', value: 'POLAND', kind: 'country' };
            }
            if (upper === 'WARSAW') {
                return { label: 'Warsaw (WAW + WMI)', value: 'WARSAW', kind: 'city' };
            }
            const airport = DESTINATIONS.find(function(a) { return a.iata === upper; });
            return {
                label: airport ? (airport.city + ' (' + airport.iata + ')') : upper,
                value: upper,
                kind: 'airport'
            };
        }

        // Seed "To" from the previous search (arriving via "Back to search") if present,
        // otherwise default to "Anywhere" like the old select's default first option did.
        if (PREFILL.to) {
            selected = PREFILL.to.split(',').map(function(t) { return t.trim(); })
                .filter(function(t) { return t; })
                .map(tokenToSelection);
        }
        if (selected.length === 0) {
            selected = [{ label: 'Anywhere', value: 'ANYWHERE', kind: 'anywhere' }];
        }
        renderChips();

        // Repopulate the rest of the form from the previous search, if any. The date fields
        // are handled by the range pickers set up at the end of this block.
        const fromEl = document.getElementById('from');
        const maxStopsEl = document.getElementById('maxStops');
        const sortByEl = document.getElementById('sortBy');
        const airlineEls = Array.prototype.slice.call(document.querySelectorAll('.airline-checkbox'));

        // "From" is a fixed list of Polish airports, but the search itself accepts any
        // comma-separated set of places on either side - so anything the list doesn't already
        // offer (whatever was swapped in from "To", or carried back by "Back to search") gets
        // its own option rather than being silently dropped.
        function setFrom(value, label) {
            const existing = Array.prototype.find.call(fromEl.options, function(o) { return o.value === value; });
            if (!existing) {
                const custom = document.getElementById('fromCustomOption') || document.createElement('option');
                custom.id = 'fromCustomOption';
                custom.value = value;
                custom.textContent = label || value;
                if (!custom.parentNode) fromEl.insertBefore(custom, fromEl.firstChild);
            }
            fromEl.value = value;
        }

        if (PREFILL.from) setFrom(PREFILL.from, PREFILL.from.split(',').map(function(t) {
            return tokenToSelection(t.trim()).label;
        }).join(', '));
        if (PREFILL.maxStops !== null && PREFILL.maxStops !== undefined) maxStopsEl.value = String(PREFILL.maxStops);
        if (PREFILL.sortBy) sortByEl.value = PREFILL.sortBy;
        if (PREFILL.airlines) {
            airlineEls.forEach(function(el) {
                el.checked = PREFILL.airlines.indexOf(el.value) !== -1;
            });
        }

        // Connection window: hours+minutes for both bounds, plus a separate "days" override
        // for the upper bound only (a lower bound in days would never make sense - the whole
        // point is a minimum layover, always small). Kept as plain number inputs (native
        // up/down spinners, still directly typable) rather than a slider, and everything here
        // is just for editing - the actual submitted values are the two hidden minutes fields
        // below, computed on submit.
        const minConnHoursEl = document.getElementById('minConnHours');
        const minConnMinutesEl = document.getElementById('minConnMinutes');
        const maxConnHoursEl = document.getElementById('maxConnHours');
        const maxConnMinutesEl = document.getElementById('maxConnMinutes');
        const maxConnDaysEl = document.getElementById('maxConnDays');
        const minConnectionMinutesHiddenEl = document.getElementById('minConnectionMinutesHidden');
        const maxConnectionMinutesHiddenEl = document.getElementById('maxConnectionMinutesHidden');

        function updateMaxConnDisabledState() {
            const daysOn = (parseInt(maxConnDaysEl.value, 10) || 0) >= 1;
            maxConnHoursEl.disabled = daysOn;
            maxConnMinutesEl.disabled = daysOn;
        }

        if (PREFILL.minConnectionMinutes !== null && PREFILL.minConnectionMinutes !== undefined) {
            minConnHoursEl.value = Math.floor(PREFILL.minConnectionMinutes / 60);
            minConnMinutesEl.value = PREFILL.minConnectionMinutes % 60;
        }
        if (PREFILL.maxConnectionMinutes !== null && PREFILL.maxConnectionMinutes !== undefined) {
            // A value of a whole day or more is treated as having come from the "days" field -
            // there's no way to tell apart "36h via hours" from "1.5 days" once collapsed into
            // a single minutes value, but they mean the same thing to the search either way.
            if (PREFILL.maxConnectionMinutes >= 1440) {
                maxConnDaysEl.value = Math.round(PREFILL.maxConnectionMinutes / 1440);
            } else {
                maxConnDaysEl.value = 0;
                maxConnHoursEl.value = Math.floor(PREFILL.maxConnectionMinutes / 60);
                maxConnMinutesEl.value = PREFILL.maxConnectionMinutes % 60;
            }
        }
        updateMaxConnDisabledState();
        maxConnDaysEl.addEventListener('input', updateMaxConnDisabledState);

        // Overnight connection, ground transfer, round-trip airport flexibility, stay duration -
        // all plain fields that submit natively (name= matches the controller param directly),
        // this just repopulates them from PREFILL and wires the ground-transfer radius reveal.
        const allowOvernightConnectionEl = document.getElementById('allowOvernightConnection');
        const allowGroundTransferEl = document.getElementById('allowGroundTransfer');
        const groundTransferRadiusRowEl = document.getElementById('groundTransferRadiusRow');
        const groundTransferRadiusKmEl = document.getElementById('groundTransferRadiusKm');
        const allowReturnToDifferentAirportEl = document.getElementById('allowReturnToDifferentAirport');
        const allowReturnFromDifferentAirportEl = document.getElementById('allowReturnFromDifferentAirport');
        const sameDepartAirportEl = document.getElementById('sameDepartAirport');
        const sameArrivalAirportEl = document.getElementById('sameArrivalAirport');
        const schengenConnectionsOnlyEl = document.getElementById('schengenConnectionsOnly');
        const stayMinDaysEl = document.getElementById('stayMinDays');
        const stayMaxDaysEl = document.getElementById('stayMaxDays');

        // Only a return visit overrides the defaults set in the markup - see HAS_PREVIOUS_SEARCH.
        if (HAS_PREVIOUS_SEARCH) {
            allowOvernightConnectionEl.checked = !!PREFILL.allowOvernightConnection;
            schengenConnectionsOnlyEl.checked = !!PREFILL.schengenConnectionsOnly;
            allowGroundTransferEl.checked = !!PREFILL.allowGroundTransfer;
            // The visible boxes say what stays the same, the remembered values say what may differ.
            sameDepartAirportEl.checked = !PREFILL.allowReturnToDifferentAirport;
            sameArrivalAirportEl.checked = !PREFILL.allowReturnFromDifferentAirport;
        }
        if (PREFILL.stayMinDays !== null && PREFILL.stayMinDays !== undefined) stayMinDaysEl.value = PREFILL.stayMinDays;
        if (PREFILL.stayMaxDays !== null && PREFILL.stayMaxDays !== undefined) stayMaxDaysEl.value = PREFILL.stayMaxDays;
        if (PREFILL.groundTransferRadiusKm !== null && PREFILL.groundTransferRadiusKm !== undefined) {
            groundTransferRadiusKmEl.value = PREFILL.groundTransferRadiusKm;
        }

        function updateGroundTransferRadiusVisibility() {
            groundTransferRadiusRowEl.style.display = allowGroundTransferEl.checked ? 'flex' : 'none';
        }
        updateGroundTransferRadiusVisibility();
        allowGroundTransferEl.addEventListener('change', updateGroundTransferRadiusVisibility);

        document.querySelector('form').addEventListener('submit', function() {
            allowReturnToDifferentAirportEl.value = sameDepartAirportEl.checked ? 'false' : 'true';
            allowReturnFromDifferentAirportEl.value = sameArrivalAirportEl.checked ? 'false' : 'true';

            const minH = parseInt(minConnHoursEl.value, 10) || 0;
            const minM = parseInt(minConnMinutesEl.value, 10) || 0;
            minConnectionMinutesHiddenEl.value = minH * 60 + minM;

            const days = parseInt(maxConnDaysEl.value, 10) || 0;
            if (days >= 1) {
                maxConnectionMinutesHiddenEl.value = days * 1440;
            } else {
                const maxH = parseInt(maxConnHoursEl.value, 10) || 0;
                const maxM = parseInt(maxConnMinutesEl.value, 10) || 0;
                maxConnectionMinutesHiddenEl.value = maxH * 60 + maxM;
            }
        });

        // Swaps the two sides of the search, which is the quick way to look for the journey
        // home ("from anywhere in Italy back to Poland") instead of the journey out.
        document.getElementById('swapFromTo').addEventListener('click', function() {
            if (selected.length === 0) {
                searchInput.focus();
                return;
            }
            if (selected.some(function(s) { return s.kind === 'anywhere'; })) {
                // "Anywhere" only means something as a destination - there's no set of airports
                // to depart from that it could turn into.
                alert('"Anywhere" can only be a destination, so this search can\'t be reversed.');
                return;
            }

            const newFromValue = selected.map(function(s) { return s.value; }).join(',');
            const newFromLabel = selected.map(function(s) { return s.label; }).join(', ');
            const oldFrom = fromEl.value;

            selected = oldFrom.split(',').map(function(t) { return t.trim(); })
                .filter(function(t) { return t; })
                .map(tokenToSelection);
            renderChips();

            setFrom(newFromValue, newFromLabel);
        });

        /**
         * A month calendar behind a single read-only field. The first click picks the start
         * and the second the end, so a range is two clicks in one place rather than two
         * separate date boxes; picking the same day twice is how you say "just this day".
         * The visible field is only ever a label - the two hidden inputs it writes are what
         * the form actually submits, so the server side is unchanged.
         */
        function createDateRange(options) {
            const root = document.getElementById(options.rootId);
            const display = root.querySelector('.daterange-input');
            const calendar = root.querySelector('.calendar');
            const startInput = document.getElementById(options.startId);
            const endInput = document.getElementById(options.endId);
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];

            let start = null;
            let end = null;
            let viewMonth = null;
            let awaitingEnd = false;

            function toIso(d) {
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
            }
            function pad(n) { return n < 10 ? '0' + n : String(n); }
            function fromIso(s) {
                const parts = s.split('-');
                return new Date(+parts[0], +parts[1] - 1, +parts[2]);
            }
            function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
            function sameDay(a, b) { return a && b && toIso(a) === toIso(b); }
            function formatShort(d) {
                return d.getDate() + ' ' + monthNames[d.getMonth()].substring(0, 3);
            }

            function minDate() {
                const floor = options.minDate ? options.minDate() : null;
                const todayDate = startOfDay(new Date());
                return floor && floor > todayDate ? floor : todayDate;
            }

            function render() {
                if (!viewMonth) {
                    viewMonth = new Date((start || minDate()).getFullYear(), (start || minDate()).getMonth(), 1);
                }
                const first = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
                const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
                // Monday-first, matching how European calendars read.
                const leading = (first.getDay() + 6) % 7;
                const floor = minDate();

                let html = '<div class="calendar-head">'
                    + '<button type="button" class="calendar-nav" data-nav="-1">‹</button>'
                    + '<span class="calendar-month">' + monthNames[viewMonth.getMonth()] + ' ' + viewMonth.getFullYear() + '</span>'
                    + '<button type="button" class="calendar-nav" data-nav="1">›</button>'
                    + '</div><div class="calendar-grid">';
                ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].forEach(function(d) {
                    html += '<div class="calendar-dow">' + d + '</div>';
                });
                for (let i = 0; i < leading; i++) {
                    html += '<button type="button" class="calendar-day blank" disabled></button>';
                }
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);
                    const iso = toIso(date);
                    const disabled = date < floor;
                    const isEdge = sameDay(date, start) || sameDay(date, end);
                    const inRange = start && end && date > start && date < end;
                    html += '<button type="button" class="calendar-day'
                        + (isEdge ? ' selected' : '') + (inRange ? ' in-range' : '') + '"'
                        + (disabled ? ' disabled' : '') + ' data-date="' + iso + '">' + day + '</button>';
                }
                html += '</div><div class="calendar-hint">'
                    + (awaitingEnd ? 'Pick the last day, or the same day again' : 'Pick a day, then another for a range')
                    + '</div>';
                calendar.innerHTML = html;
            }

            function syncOut() {
                startInput.value = start ? toIso(start) : '';
                // A single day is submitted as a start with no end, which is what the server
                // already treats as "just this date".
                endInput.value = end && !sameDay(start, end) ? toIso(end) : '';

                if (!start) {
                    display.value = '';
                } else if (!end || sameDay(start, end)) {
                    display.value = formatShort(start) + ' ' + start.getFullYear();
                } else {
                    display.value = formatShort(start) + ' – ' + formatShort(end) + ' ' + end.getFullYear();
                }
                if (options.onChange) options.onChange();
            }

            function open() {
                document.querySelectorAll('.calendar.open').forEach(function(c) {
                    if (c !== calendar) c.classList.remove('open');
                });
                viewMonth = new Date((start || minDate()).getFullYear(), (start || minDate()).getMonth(), 1);
                render();
                calendar.classList.add('open');
            }

            function close() {
                calendar.classList.remove('open');
                awaitingEnd = false;
            }

            display.addEventListener('click', function(e) {
                e.stopPropagation();
                calendar.classList.contains('open') ? close() : open();
            });

            calendar.addEventListener('click', function(e) {
                // Picking a day re-renders the grid, which detaches the very button that was
                // clicked - so by the time the click reaches the document-level "clicked
                // outside" handler, the target is no longer inside this widget and the range
                // would be closed and reset halfway through. Keeping the click here avoids it.
                e.stopPropagation();

                const nav = e.target.closest('[data-nav]');
                if (nav) {
                    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + Number(nav.dataset.nav), 1);
                    render();
                    return;
                }
                const dayButton = e.target.closest('[data-date]');
                if (!dayButton || dayButton.disabled) {
                    return;
                }
                const picked = fromIso(dayButton.dataset.date);
                if (!awaitingEnd) {
                    start = picked;
                    end = null;
                    awaitingEnd = true;
                    render();
                    syncOut();
                    return;
                }
                // A second pick before the first restarts the range rather than inverting it.
                if (picked < start) {
                    start = picked;
                    render();
                    syncOut();
                    return;
                }
                end = picked;
                awaitingEnd = false;
                render();
                syncOut();
                close();
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('#' + options.rootId)) close();
            });

            return {
                startDate: function() { return start; },
                set: function(startIso, endIso) {
                    start = startIso ? fromIso(startIso) : null;
                    end = endIso ? fromIso(endIso) : null;
                    awaitingEnd = false;
                    syncOut();
                },
                clear: function() {
                    start = null;
                    end = null;
                    awaitingEnd = false;
                    syncOut();
                }
            };
        }

        const returnRange = createDateRange({
            rootId: 'returnRange',
            startId: 'returnDate',
            endId: 'returnRangeEnd',
            // Coming back before leaving is not a trip anyone can take.
            minDate: function() { return departureRange ? departureRange.startDate() : null; },
            onChange: function() {
                document.getElementById('returnClear').style.display =
                    document.getElementById('returnDate').value ? 'inline' : 'none';
            }
        });

        const departureRange = createDateRange({
            rootId: 'departureRange',
            startId: 'departure',
            endId: 'departureRangeEnd'
        });

        departureRange.set(PREFILL.departure || new Date().toISOString().split('T')[0], PREFILL.departureRangeEnd);
        returnRange.set(PREFILL.returnDate, PREFILL.returnRangeEnd);

        document.getElementById('returnClear').addEventListener('click', function() {
            returnRange.clear();
        });
    })();
    </script>
</body>
</html>

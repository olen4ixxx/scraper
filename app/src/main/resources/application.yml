spring:
  application:
    name: flight-search
  
  datasource:
    url: jdbc:postgresql://localhost:5432/flights
    username: flights
    password: flights
    driver-class-name: org.postgresql.Driver
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    org.example.flightsearch: DEBUG
    org.springframework.web: INFO

flight:
  search:
    min-connection-minutes: 90
    max-connection-hours: 12

collector:
  days-ahead: 60
  max-concurrency: 2
  request-delay-ms: 1000
  max-retries: 3
  wizz:
    enabled: true
    request-delay-ms: 1000
  ryanair:
    enabled: true
    request-delay-ms: 1000

spring:
  application:
    name: flight-search
  
  datasource:
    url: jdbc:postgresql://localhost:5432/flights
    username: flights
    password: flights
    driver-class-name: org.postgresql.Driver
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  sql:
    init:
      mode: never

server:
  # Hosting platforms assign the port at runtime and expect the app to bind to it.
  port: ${PORT:8080}

logging:
  level:
    org.example.flightsearch: DEBUG
    org.springframework.web: INFO

flight:
  search:
    min-connection-minutes: 90
    max-connection-hours: 12

collector:
  # Turn off wherever the app is only serving the site (a public deployment): it stops the
  # nightly scheduled run and unregisters the /collect endpoints, so a browsable instance
  # can't start scraping - on its own timer or because someone found the URL. Collection
  # happens in the scheduled GitHub Actions run, which uses the default (enabled).
  enabled: true
  days-ahead: 60
  max-concurrency: 2
  request-delay-ms: 1000
  max-retries: 3
  wizz:
    enabled: true
    request-delay-ms: 1000
  ryanair:
    enabled: true
    request-delay-ms: 1000
